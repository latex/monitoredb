services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "3000:3000"
    environment:
      MONITOREDB_TOKEN: ${MONITOREDB_TOKEN:-}
    volumes:
      - server_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD no .env}
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    depends_on:
      server:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    environment:
      MONITOREDB_AGENT_TOKEN: ${MONITOREDB_TOKEN:-}
      MONITOREDB_SQL_PASSWORD: ${MSSQL_SA_PASSWORD}
    command: ["--server", "http://server:3000", "--agent-id", "localhost", "--sql-host", "sqlserver", "--sql-user", "sa", "--interval", "30"]
    restart: unless-stopped

volumes:
  sqlserver_data:
  server_data:
